name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  UV_NO_PROGRESS: "1"

jobs:
  python-quality:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check public dependency sources before installation
        run: python scripts/check_dependency_sources.py

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --dev --locked

      - name: Check Python formatting
        run: uv run ruff format --check .

      - name: Lint Python
        run: uv run ruff check .

      - name: Enforce quality ratchets
        run: uv run python scripts/quality_ratchet.py

      - name: Type-check protected core modules
        run: uv run pyright --project pyright-core.json

      # Device, cloud, manual, and end-to-end suites require dedicated
      # infrastructure and intentionally do not run on GitHub-hosted runners.
      - name: Run deterministic Python tests
        if: github.event_name == 'workflow_dispatch'
        run: >-
          uv run pytest
          tests/unit
          tests/tools
          packages/artemis-client/tests
          -q
          --cov=artemis
          --cov=mcp_server
          --cov=apps/admin_console
          --cov-fail-under=60

  frontend-next:
    name: Next.js lint, typecheck, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/showcase_next

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: apps/showcase_next/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Lint Next.js frontend
        run: npm run lint

      - name: Type-check Next.js frontend
        run: npm run typecheck

      - name: Run Next.js frontend tests
        run: npm test

      - name: Build Next.js static export
        run: npm run build

      - name: Enforce Next.js export budgets
        run: npm run budget:check

      - name: Set up Python for FastAPI acceptance fixture
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install controlled acceptance fixture dependencies
        run: python -m pip install --disable-pip-version-check fastapi uvicorn

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production export browser acceptance
        run: npm run test:acceptance -- --project=chromium

  package:
    name: Build and smoke-test Python packages / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: |
            apps/showcase_next/package-lock.json

      - name: Build Next.js frontend assets for the wheel
        run: |
          npm ci --prefix apps/showcase_next
          npm run build --prefix apps/showcase_next

      - name: Build client and Artemis distributions
        run: |
          uv build --package artemis-client --wheel --out-dir dist
          uv build --package artemis --wheel --sdist --out-dir dist

      - name: Install wheels in a clean environment
        shell: bash
        run: |
          uv venv .smoke-venv --python 3.12
          smoke_python=.smoke-venv/bin/python
          if [ "$RUNNER_OS" = "Windows" ]; then smoke_python=.smoke-venv/Scripts/python.exe; fi
          uv pip install --python "$smoke_python" dist/artemis_client-*.whl dist/artemis-*.whl

      - name: Smoke-test installed package and CLI
        shell: bash
        run: |
          smoke_dir="$RUNNER_TEMP/artemis-wheel-smoke"
          mkdir -p "$smoke_dir"
          cd "$smoke_dir"
          smoke_python="$GITHUB_WORKSPACE/.smoke-venv/bin/python"
          if [ "$RUNNER_OS" = "Windows" ]; then smoke_python="$GITHUB_WORKSPACE/.smoke-venv/Scripts/python.exe"; fi
          "$smoke_python" - <<'PY'
          from importlib.metadata import files, version

          import artemis
          from artemis.resources import get_bundled_config_path, get_bundled_showcase_dist

          bundled_config = get_bundled_config_path("artemis.jsonc")
          bundled_ui = get_bundled_showcase_dist()
          assert artemis.__version__ == version("artemis")
          assert bundled_config is not None and bundled_config.is_file()
          assert bundled_ui is not None and (bundled_ui / "index.html").is_file()
          assert not any("node_modules" in str(path) for path in (files("artemis") or ()))
          print(f"Installed Artemis {artemis.__version__} with bundled runtime resources")
          PY
          if [ "$RUNNER_OS" = "Windows" ]; then
            "$GITHUB_WORKSPACE/.smoke-venv/Scripts/artemis.exe" --version
            "$GITHUB_WORKSPACE/.smoke-venv/Scripts/artemis.exe" --help
          else
            "$GITHUB_WORKSPACE/.smoke-venv/bin/artemis" --version
            "$GITHUB_WORKSPACE/.smoke-venv/bin/artemis" --help
          fi

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7
